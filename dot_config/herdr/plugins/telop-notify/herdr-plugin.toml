# エージェントの pane が入力待ち（blocked）か完了（done）になったら、telop にカードを流す。
# pane.agent_status_changed は状態が変わったときにだけ出るので、前の状態を覚えておかなくてよい。
# telop が動いていないときは受け口へ書けずに script が 0 以外で終わり、plugin の log に失敗として残るだけで、herdr には影響しない。
id = "syaku.telop-notify"
name = "telop notify"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Send agent blocked/done changes to telop"
platforms = ["macos", "windows"]

# カードには、紫の地と状態ごとのアイコン、クリックでその pane に飛ぶ action（focus.sh / focus.ps1）を付ける。
# telop send を通さずに受け口へ 1 行の JSON を直接書くので、telop の版に依らずに本文は出る。
# 色とアイコンは、それを知らない古い telop-app では無視される。
# command はシェルを通らない。Mac は OS に入っている bash と jq で、Windows は PowerShell 7 で動かす。
[[events]]
on = "pane.agent_status_changed"
platforms = ["macos"]
command = ["/bin/bash", "notify.sh"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["windows"]
command = ["pwsh.exe", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "notify.ps1"]
